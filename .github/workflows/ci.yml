name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  music-server:
    name: Music Server (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # 零依赖模块（无 go.sum），setup-go 的依赖缓存无用武之地——
      # 曾配置 cache-dependency-path 指向不存在的 go.sum 导致 CI 起跑即失败。
      # Go 版本与 music_server/Dockerfile 的 GO_VERSION 保持一致。
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: false

      - name: gofmt
        run: test -z "$(gofmt -l music_server/)"
      - name: go vet
        run: go vet ./...
        working-directory: music_server
      - name: go build
        run: go build -o /dev/null .
        working-directory: music_server
      - name: go test
        # -race 检测数据竞争(限流表/曲库索引均有并发读写,见 snapshot 与
        # ipWindowLimiter);race 检测器在 runner 上开箱可用,无需额外依赖。
        run: go test -race -count=1 ./...
        working-directory: music_server

  shader-playground:
    name: Shader Playground (Vite)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: shader_playground/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile
        working-directory: shader_playground
      - name: lint (biome)
        run: pnpm run lint
        working-directory: shader_playground
      - name: unit tests (vitest)
        run: pnpm test
        working-directory: shader_playground
      - name: build (tsc + vite)
        run: pnpm run build
        working-directory: shader_playground
